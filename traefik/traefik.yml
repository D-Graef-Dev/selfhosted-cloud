api:
  dashboard: true

log:
  level: INFO

accessLog:
  filePath: "/logs/access.log"
  format: json

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

  file:
    directory: /dynamic
    watch: true

entryPoints:
  web:
    address: ":80"

    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      # Mail wird NICHT hier gesetzt, sondern per ENV-Var injiziert
      # (siehe TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL in compose.yaml)
      # Grund: Der File-Provider für statische Config unterstützt keine ${VAR}-Interpolation :(
      storage: /letsencrypt/acme.json

      httpChallenge:
        entryPoint: web
