global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true

log:
  level: INFO

accessLog:
  format: json

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

  file:
    directory: /dynamic
    watch: true

entryPoints:
  web:
    address: ":80"

    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - secured@file

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json

      httpChallenge:
        entryPoint: web
