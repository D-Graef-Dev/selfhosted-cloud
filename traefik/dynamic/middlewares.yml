http:
  middlewares:

    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    compression:
      compress: {}

    dashboard-auth:
      basicAuth:
        usersFile: /run/secrets/dashboard_auth_users

    monitoring-auth:
      basicAuth:
        usersFile: /run/secrets/monitoring_auth_users

    secured:
      chain:
        middlewares:
          - security-headers
          - compression

    vpn-only:
      ipAllowList:
        sourceRange:
          - "10.10.10.0/24"

    rate-limit:
      rateLimit:
        average: 30
        burst: 100

    login-rate-limit:
      rateLimit:
        average: 6
        period: 1m
        burst: 5

    authelia:
      forwardAuth:
        address: "http://authelia:9091/api/authz/forward-auth"
        trustForwardHeader: true
        maxResponseBodySize: 8192
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Email
          - Remote-Name
