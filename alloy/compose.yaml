services:
  alloy:
    image: grafana/alloy:v1.18.1

    container_name: alloy

    restart: unless-stopped

    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - ./data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - monitoring

networks:
  monitoring:
    external: true
