groups:
  - name: targets
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.job }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} (job {{ $labels.job }}) for at least 2 minutes."
