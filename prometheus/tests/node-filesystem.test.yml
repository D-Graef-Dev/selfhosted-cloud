rule_files:
  - ../rules/node-filesystem.yml

evaluation_interval: 1m

tests:
  # Scenario 1: filling up slowly, 32% free after 10h
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node_exporter", instance="host.docker.internal:9100", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '100+0x600'
      - series: 'node_filesystem_avail_bytes{job="node_exporter", instance="host.docker.internal:9100", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '50-0.03x600'
      - series: 'node_filesystem_readonly{job="node_exporter", instance="host.docker.internal:9100", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '0+0x600'

    alert_rule_test:
      - eval_time: 600m
        alertname: NodeFilesystemSpaceFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node_exporter
              instance: host.docker.internal:9100
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Filesystem is predicted to run out of space within the next 24 hours."
              description: "Filesystem on /dev/sda1, mounted on /, at host.docker.internal:9100 has only 32.00% available space left and is filling up."

      - eval_time: 600m
        alertname: NodeFilesystemAlmostOutOfSpace
        exp_alerts: []

  # Scenario 2: filling up fast, 1% free after 620m
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node_exporter", instance="host.docker.internal:9100", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '100+0x620'
      - series: 'node_filesystem_avail_bytes{job="node_exporter", instance="host.docker.internal:9100", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '32-0.05x620'
      - series: 'node_filesystem_readonly{job="node_exporter", instance="host.docker.internal:9100", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '0+0x620'

    alert_rule_test:
      - eval_time: 620m
        alertname: NodeFilesystemSpaceFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node_exporter
              instance: host.docker.internal:9100
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Filesystem is predicted to run out of space within the next 24 hours."
              description: "Filesystem on /dev/sda1, mounted on /, at host.docker.internal:9100 has only 1.00% available space left and is filling up."
          - exp_labels:
              severity: critical
              job: node_exporter
              instance: host.docker.internal:9100
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Filesystem is predicted to run out of space within the next 4 hours."
              description: "Filesystem on /dev/sda1, mounted on /, at host.docker.internal:9100 has only 1.00% available space left and is filling up fast."

      - eval_time: 620m
        alertname: NodeFilesystemAlmostOutOfSpace
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node_exporter
              instance: host.docker.internal:9100
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Filesystem has less than 5% space left."
              description: "Filesystem on /dev/sda1, mounted on /, at host.docker.internal:9100 has only 1.00% available space left."
          - exp_labels:
              severity: critical
              job: node_exporter
              instance: host.docker.internal:9100
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Filesystem has less than 3% space left."
              description: "Filesystem on /dev/sda1, mounted on /, at host.docker.internal:9100 has only 1.00% available space left."
