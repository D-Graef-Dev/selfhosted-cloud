rule_files:
  - ../rules/targets.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="cadvisor", instance="cadvisor:8080"}'
        values: '1 1 1 0 0 0 0 0 0'

    alert_rule_test:
      - eval_time: 4m
        alertname: TargetDown
        exp_alerts: []

      - eval_time: 6m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: cadvisor
              instance: cadvisor:8080
            exp_annotations:
              summary: "Target cadvisor is down"
              description: "Prometheus has not been able to scrape cadvisor:8080 (job cadvisor) for at least 2 minutes."
